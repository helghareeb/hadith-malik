name: Deploy book site

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'   # daily, picks up changes in the main site's repository

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the main site's source
        uses: actions/checkout@v4
        with:
          repository: helghareeb/helghareeb.github.io

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build this book's site
        env:
          HADITH_BOOK: malik
          PUBLIC_GOATCOUNTER_CODE: ${{ vars.PUBLIC_GOATCOUNTER_CODE }}
        run: ASTRO_TELEMETRY_DISABLED=1 npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
